[project]
name = "django-agentic-ai"
version = "0.1.0"
description = "Multi-agent Django chat system, built from scratch as a learning project"
authors = [
    { name = "Andhar7", email = "boxingprofi@web.de" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.5",
    "redis>=8.1.0",
]

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
